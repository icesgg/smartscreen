<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartScreen Admin</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #242835;
      --border: #2e3345;
      --text: #e4e6ed;
      --text-dim: #8b8fa3;
      --accent: #4f8cff;
      --accent-hover: #6ba0ff;
      --danger: #f04e5e;
      --danger-hover: #f2727f;
      --success: #34d399;
      --radius: 8px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      padding: 8px 16px;
      transition: background 0.15s;
    }

    input,
    select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 8px 12px;
      font-size: 14px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--accent);
    }

    /* ── 로그인 화면 ── */
    #auth-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      width: 380px;
    }

    .auth-card h1 {
      font-size: 22px;
      margin-bottom: 4px;
    }

    .auth-card p.sub {
      color: var(--text-dim);
      font-size: 13px;
      margin-bottom: 24px;
    }

    .auth-card label {
      display: block;
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .auth-card input {
      width: 100%;
      margin-bottom: 14px;
    }

    .auth-card .btn-primary {
      width: 100%;
      background: var(--accent);
      color: #fff;
      padding: 10px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .auth-card .btn-primary:hover {
      background: var(--accent-hover);
    }

    .auth-card .btn-secondary {
      width: 100%;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--border);
      padding: 10px;
    }

    .auth-card .btn-secondary:hover {
      background: var(--surface2);
    }

    .auth-card .btn-google {
      width: 100%;
      background: #fff;
      color: #333;
      padding: 10px;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid #ddd;
    }

    .auth-card .btn-google:hover {
      background: #f5f5f5;
    }

    .auth-card .btn-google svg {
      width: 20px;
      height: 20px;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0;
      color: var(--text-dim);
      font-size: 13px;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .auth-error {
      color: var(--danger);
      font-size: 13px;
      margin-bottom: 10px;
      display: none;
    }

    /* ── 대시보드 ── */
    #dashboard {
      display: none;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .topbar h2 {
      font-size: 18px;
    }

    .topbar .right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar .btn-sm {
      background: var(--surface2);
      color: var(--text-dim);
      font-size: 13px;
      padding: 6px 12px;
    }

    .topbar .btn-sm:hover {
      color: var(--text);
      background: var(--border);
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* 업로드 폼 */
    .upload-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .upload-section h3 {
      font-size: 15px;
      margin-bottom: 16px;
    }

    .upload-row {
      display: flex;
      gap: 12px;
      align-items: end;
      flex-wrap: wrap;
    }

    .upload-row .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .upload-row .field label {
      font-size: 12px;
      color: var(--text-dim);
    }

    .upload-row input[type="file"] {
      padding: 6px;
    }

    .upload-row select {
      min-width: 120px;
    }

    .btn-upload {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      padding: 9px 20px;
    }

    .btn-upload:hover {
      background: var(--accent-hover);
    }

    .btn-upload:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .upload-status {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 10px;
    }

    /* 콘텐츠 테이블 */
    .content-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .content-section h3 {
      font-size: 15px;
      padding: 20px 24px 0 24px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    th {
      text-align: left;
      padding: 10px 16px;
      font-size: 12px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }

    td {
      padding: 12px 16px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
    }

    tr:last-child td {
      border-bottom: none;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
    }

    .badge-image {
      background: #1e3a5f;
      color: #60a5fa;
    }

    .badge-video {
      background: #3b1f4b;
      color: #c084fc;
    }

    .badge-center {
      background: #1a3329;
      color: var(--success);
    }

    .badge-banner {
      background: #3b2f1a;
      color: #fbbf24;
    }

    .badge-active {
      background: #1a3329;
      color: var(--success);
      cursor: pointer;
      user-select: none;
    }

    .badge-active:hover {
      background: #22443a;
    }

    .badge-inactive {
      background: var(--border);
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
    }

    .badge-inactive:hover {
      background: #3a3f54;
    }

    .btn-delete {
      background: transparent;
      color: var(--danger);
      font-size: 13px;
      padding: 4px 10px;
      border: 1px solid var(--danger);
    }

    .btn-delete:hover {
      background: var(--danger);
      color: #fff;
    }

    .section-note {
      color: var(--text-dim);
      font-size: 13px;
      margin: -6px 0 14px;
    }

    .badge-approved {
      background: rgba(52, 211, 153, 0.15);
      color: var(--success);
      cursor: pointer;
    }

    .badge-approved:hover {
      background: rgba(52, 211, 153, 0.28);
    }

    .badge-notyet {
      background: var(--surface2);
      color: var(--text-dim);
      cursor: pointer;
    }

    .badge-notyet:hover {
      color: var(--text);
    }

    .badge-readonly {
      cursor: default !important;
    }

    /* 프로그램 업데이트의 Windows / Mac 구획 */
    .release-platform {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      padding: 18px 24px 10px 24px;
    }

    .release-platform + .section-note {
      padding: 0 24px;
    }

    .empty-msg {
      padding: 40px;
      text-align: center;
      color: var(--text-dim);
    }

    /* Org ID 표시 */
    .org-id-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      font-size: 13px;
      color: var(--text-dim);
    }

    .org-id-bar code {
      background: var(--surface2);
      padding: 4px 10px;
      border-radius: 4px;
      font-family: monospace;
      color: var(--text);
      font-size: 13px;
    }

    .btn-copy {
      background: var(--surface2);
      color: var(--text-dim);
      font-size: 12px;
      padding: 4px 10px;
    }

    .btn-copy:hover {
      color: var(--text);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--success);
      color: #000;
      padding: 10px 20px;
      border-radius: var(--radius);
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>

<body>

  <!-- ── 로그인 / 회원가입 ── -->
  <div id="auth-screen">
    <div class="auth-card">
      <h1>SmartScreen Admin</h1>
      <p class="sub">Enterprise 콘텐츠 관리 대시보드</p>
      <div id="auth-error" class="auth-error"></div>

      <!-- Google 로그인 -->
      <button class="btn-google" id="btn-google-login" onclick="handleGoogleLogin()">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" />
          <path fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A11.96 11.96 0 0 0 0 12c0 1.94.46 3.77 1.28 5.39l3.56-2.83.01-.47z" />
          <path fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
        </svg>
        Google 계정으로 로그인
      </button>

      <div class="auth-divider">또는</div>

      <!-- 이메일 로그인 -->
      <label>이메일</label>
      <input type="email" id="email" placeholder="admin@company.com">
      <label>비밀번호</label>
      <input type="password" id="password" placeholder="••••••••">
      <div id="org-name-field" style="display:none">
        <label>조직 이름 (신규 가입 시)</label>
        <input type="text" id="org-name" placeholder="회사명" style="width:100%;margin-bottom:14px">
      </div>
      <button class="btn-primary" id="btn-login" onclick="handleLogin()">이메일로 로그인</button>
      <button class="btn-secondary" id="btn-register" onclick="handleRegister()">새 계정 만들기</button>
    </div>
  </div>

  <!-- ── 대시보드 ── -->
  <div id="dashboard">
    <div class="topbar">
      <h2 id="org-title">SmartScreen</h2>
      <div class="right">
        <span id="user-email" style="font-size:13px;color:var(--text-dim)"></span>
        <button class="btn-sm" onclick="handleLogout()">로그아웃</button>
      </div>
    </div>
    <div class="container">
      <!-- 조직 ID + API 정보 -->
      <div class="org-id-bar">
        <span>조직 ID:</span>
        <code id="org-id-display">-</code>
        <button class="btn-copy" onclick="copyOrgId()">복사</button>
      </div>
      <div class="org-id-bar">
        <span>API:</span>
        <code id="api-url-display" style="font-size:11px">-</code>
        <button class="btn-copy" onclick="copyApiUrl()">복사</button>
      </div>

      <!-- 업로드 -->
      <div class="upload-section">
        <h3>콘텐츠 업로드</h3>
        <div class="upload-row">
          <div class="field">
            <label>파일 선택</label>
            <input type="file" id="file-input" accept="image/*,video/*">
          </div>
          <div class="field">
            <label>표시 위치</label>
            <select id="position-select">
              <option value="center">중앙 (Center)</option>
              <option value="banner">배너 (Banner)</option>
            </select>
          </div>
          <button class="btn-upload" id="btn-upload" onclick="handleUpload()">업로드</button>
        </div>
        <div class="upload-status" id="upload-status"></div>
      </div>

      <!-- 콘텐츠 목록 -->
      <div class="content-section">
        <h3>콘텐츠 목록</h3>
        <div id="content-list"></div>
      </div>

      <!-- 프로그램 업데이트 승인 (docs/UPDATE.md, docs/MAC.md) -->
      <!-- 이 조직의 PC 들은 여기서 승인된 버전 중 가장 높은 것만 받는다.
           승인이 없으면 PC 화면에 "관리자 승인을 기다려요" 로 보이기만 한다.
           Windows 와 Mac 은 표도 승인도 따로다 (supabase/mac_releases.sql) - 같은 번호라도
           각각 승인한다. -->
      <div class="content-section">
        <h3>프로그램 업데이트</h3>
        <h4 class="release-platform">Windows</h4>
        <p class="section-note" id="release-note">불러오는 중...</p>
        <div id="release-list"></div>
        <h4 class="release-platform">Mac</h4>
        <p class="section-note" id="mac-release-note">불러오는 중...</p>
        <div id="mac-release-list"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    // ── DB 스키마 변경 필요 ──
    // contents 테이블에 active 컬럼을 추가하려면 아래 SQL을 실행하세요:
    // ALTER TABLE contents ADD COLUMN IF NOT EXISTS active boolean NOT NULL DEFAULT false;

    // ── Supabase 설정 ──
    // 아래 값을 본인의 Supabase 프로젝트 값으로 교체하세요
    const SUPABASE_URL = 'https://vnonoschrzbgvyeduosm.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZub25vc2NocnpiZ3Z5ZWR1b3NtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NzkyNjQsImV4cCI6MjA5MTI1NTI2NH0.KqkmH7UtcR4ihFDMmAMfWRH0O2P2s__Jglzr5QWIzfc';

    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentOrg = null;
    let currentRole = 'member';   // 'admin' 만 업데이트를 승인할 수 있다

    // 올릴 수 있는 콘텐츠 형식. PC 가 실제로 띄울 수 있는 것과 같다 (영상:
    // client/video/player.cpp 의 IsVideoFile, 그림: GDI+), 그리고 서버의
    // contents_storage_path_shape 제약(supabase/hardening.sql)과 **같아야 한다** -
    // 여기만 늘리면 파일은 올라가고 행이 거절된다. 셋을 같이 고칠 것.
    const CONTENT_EXT = {
      png:  { type: 'image', mime: 'image/png' },
      jpg:  { type: 'image', mime: 'image/jpeg' },
      jpeg: { type: 'image', mime: 'image/jpeg' },
      bmp:  { type: 'image', mime: 'image/bmp' },
      gif:  { type: 'image', mime: 'image/gif' },
      mp4:  { type: 'video', mime: 'video/mp4' },
      avi:  { type: 'video', mime: 'video/x-msvideo' },
      wmv:  { type: 'video', mime: 'video/x-ms-wmv' },
      mkv:  { type: 'video', mime: 'video/x-matroska' },
      mov:  { type: 'video', mime: 'video/quicktime' },
      webm: { type: 'video', mime: 'video/webm' },
    };
    const CONTENT_MAX_BYTES = 209715200;   // 200 MB. 서버의 contents_file_size_range 와 같다

    // ── 유틸리티 ──
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2500);
    }

    function showError(msg) {
      const el = document.getElementById('auth-error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(1) + ' MB';
    }

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('ko-KR', {
        year: 'numeric', month: '2-digit', day: '2-digit'
      });
    }

    // SHA-256 해시 계산
    async function computeSHA256(file) {
      const buffer = await file.arrayBuffer();
      const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // ── 인증 ──
    window.handleGoogleLogin = async function () {
      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.href
        }
      });
      if (error) showError(error.message);
    };

    window.handleLogin = async function () {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) return showError('이메일과 비밀번호를 입력하세요.');
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) return showError(error.message);
      await initDashboard();
    };

    window.handleRegister = async function () {
      const field = document.getElementById('org-name-field');
      if (field.style.display === 'none') {
        field.style.display = 'block';
        return;
      }
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const orgName = document.getElementById('org-name').value.trim();
      if (!email || !password) return showError('이메일과 비밀번호를 입력하세요.');
      if (!orgName) return showError('조직 이름을 입력하세요.');

      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) return showError(error.message);

      // 메일 확인이 켜진 프로젝트(Supabase 기본값)에서는 signUp 이 user 만 주고
      // session 은 주지 않는다. 그대로 조직을 넣으면 요청이 anon key 로 나가고
      // orgs 의 insert 정책(to authenticated)이 거절해서, 계정은 만들어졌는데
      // 화면에는 "조직 생성 실패: row-level security" 만 남았다. 여기서 멈춘다 -
      // 조직은 메일을 확인하고 처음 로그인했을 때 initDashboard 의 "조직 없음"
      // 화면에서 만든다. 이미 가입된 주소도 같은 모양(가짜 user, session 없음)으로
      // 오는데 그때는 메일이 가지 않으므로 문구에 함께 적는다.
      if (!data || !data.session) {
        return showError('확인 메일을 보냈습니다. 메일의 링크를 누른 뒤 이 페이지로 돌아와 로그인하세요. 조직은 첫 로그인 때 만듭니다. (이미 가입한 주소라면 메일이 가지 않습니다 - 그대로 로그인하세요.)');
      }

      // 조직 생성 (트리거가 admin 멤버 자동 등록)
      const { error: orgErr } = await supabase.from('orgs').insert({
        name: orgName,
        created_by: data.user.id
      });
      if (orgErr) return showError('조직 생성 실패: ' + orgErr.message);

      await initDashboard();
    };

    window.handleLogout = async function () {
      await supabase.auth.signOut();
      currentOrg = null;
      document.getElementById('auth-screen').style.display = 'flex';
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('auth-error').style.display = 'none';
    };

    // ── 대시보드 초기화 ──
    async function initDashboard() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return;

      // 소속 조직 조회
      // .single() 을 쓰지 않는다. single 은 "행이 없음" 도 오류(PGRST116)로 돌려주고
      // 예전 코드는 error 를 버렸기 때문에, 서버가 잠깐 5xx 를 내거나 정책 오류가
      // 나도 "조직 없음" 과 똑같이 보여 이미 조직이 있는 관리자에게 조직 생성
      // 화면이 떴다 - 거기서 이름을 넣으면 두 번째 조직이 생긴다. 배열로 받아
      // "조회 실패" 와 "0 행" 을 가른다.
      // 멤버십이 여럿이면 내가 만든 조직을 먼저, 그 안에서는 가장 먼저 생긴 것을
      // 쓴다. 순서를 안 주면 DB 가 주는 대로라 어느 날 새로 생긴 빈 조직으로 열릴
      // 수 있고, PC 들은 옛 조직 id 로 설정돼 있어 거기서 올린 것은 어느 PC 에도
      // 가지 않는다. (조직 고르기는 없다.)
      // org_members.created_at 만으로 고르면 안 된다: org_members 의 insert 정책은
      // 어느 조직의 admin 이든 아무 user_id 를, created_at 까지 적어 넣게 둔다. 밖의
      // 누구든 자기 조직에 남을 옛 날짜로 넣으면 그 사람의 대시보드가 남의 조직으로
      // 열린다. orgs.created_by 는 insert 정책이 auth.uid() 로 묶고 update 정책이
      // 없어서 남이 꾸밀 수 없다.
      // 멤버십을 다 받아 와 여기서 고르지 않고 서버에서 거른다: 심어 넣은 행이 한
      // 응답의 행 수 한도(Supabase 기본 1000)를 넘으면 내 행이 잘려 나가 못 찾는다.
      const { data: ownOrgs, error: ownErr } = await supabase
        .from('orgs')
        .select('id')
        .eq('created_by', user.id)
        .order('created_at', { ascending: true })
        .order('id', { ascending: true })
        .limit(1);

      if (ownErr) {
        showError('소속 조직을 읽지 못했습니다: ' + ownErr.message + ' (잠시 뒤 새로고침해 보세요.)');
        return;
      }

      // 내가 만든 조직이 없으면(SQL Editor 로 남의 조직에 넣어 준 멤버) 예전처럼
      // 가장 먼저 생긴 멤버십이다. 이 경우는 여기서 막을 수 없다 - 위 주석 참고.
      let memQuery = supabase
        .from('org_members')
        .select('org_id, role, orgs(id, name)')
        .eq('user_id', user.id);
      if (ownOrgs && ownOrgs.length > 0) memQuery = memQuery.eq('org_id', ownOrgs[0].id);
      const { data: memberships, error: memErr } = await memQuery
        .order('created_at', { ascending: true })
        .order('org_id', { ascending: true })
        .limit(1);

      if (memErr) {
        showError('소속 조직을 읽지 못했습니다: ' + memErr.message + ' (잠시 뒤 새로고침해 보세요.)');
        return;
      }
      const membership = (memberships && memberships.length > 0) ? memberships[0] : null;

      if (membership && !membership.orgs) {
        // 멤버십은 있는데 조직 행이 안 딸려 왔다 (orgs 의 select 정책이나 관계 캐시).
        // 조직이 없는 것이 아니므로 생성 화면으로 보내지 않는다.
        showError('조직 정보를 읽지 못했습니다. (잠시 뒤 새로고침해 보세요.)');
        return;
      }

      if (!membership) {
        // 조직이 없으면 조직 생성 화면 표시
        document.getElementById('auth-error').style.display = 'none';
        document.querySelector('.auth-card p.sub').textContent = user.email + ' 으로 로그인됨';
        document.getElementById('org-name-field').style.display = 'block';
        document.getElementById('btn-login').style.display = 'none';
        document.getElementById('btn-register').style.display = 'none';
        document.getElementById('btn-google-login').style.display = 'none';
        document.querySelector('.auth-divider').style.display = 'none';
        document.getElementById('email').style.display = 'none';
        document.getElementById('password').style.display = 'none';
        document.querySelectorAll('.auth-card > label').forEach(el => el.style.display = 'none');

        if (!document.getElementById('btn-create-org')) {
          const createBtn = document.createElement('button');
          createBtn.id = 'btn-create-org';
          createBtn.className = 'btn-primary';
          createBtn.textContent = '조직 생성';
          createBtn.style.width = '100%';
          createBtn.onclick = async () => {
            const orgName = document.getElementById('org-name').value.trim();
            if (!orgName) { showError('조직 이름을 입력하세요.'); return; }
            createBtn.disabled = true;
            createBtn.textContent = '생성 중...';
            try {
              // .select() 를 붙이지 않는다. 붙이면 INSERT ... RETURNING 이 되고, 그러면
              // orgs 의 select 정책("내가 멤버인 조직")이 새 행에도 걸리는데, 멤버십은
              // 행이 들어간 뒤의 트리거가 만든다 - 아직 없으니 RLS 가 거절한다.
              const { error: orgErr } = await supabase.from('orgs').insert({
                name: orgName,
                created_by: user.id
              });
              if (orgErr) { showError('조직 생성 실패: ' + orgErr.message); return; }
              // 트리거로 org_members가 자동 생성되므로 바로 대시보드 진입
              window.location.reload();
            } catch (e) {
              showError('오류: ' + e.message);
            } finally {
              createBtn.disabled = false;
              createBtn.textContent = '조직 생성';
            }
          };
          document.getElementById('org-name-field').after(createBtn);
        }
        return;
      }

      currentOrg = membership.orgs;
      currentRole = membership.role || 'member';

      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      document.getElementById('org-title').textContent = currentOrg.name;
      document.getElementById('org-id-display').textContent = currentOrg.id;
      document.getElementById('api-url-display').textContent =
        `${SUPABASE_URL}/rest/v1/contents?org_id=eq.${currentOrg.id}&select=*`;
      document.getElementById('user-email').textContent = user.email;

      await loadContents();
      await loadReleases();
    }

    // ── 프로그램 업데이트 승인 ──
    // releases(누구나 읽음) 와 이 조직의 org_release_approvals 를 붙여 보여 준다.
    // 승인/취소는 admin 만 (RLS 가 한 번 더 막는다). 버전 비교는 세 숫자를 숫자로 -
    // 클라이언트(client/relver.h)와 같은 규칙이어야 "PC 들이 받을 버전" 이 맞는다.
    //
    // Mac 은 표가 따로다 (mac_releases / org_mac_release_approvals, supabase/mac_releases.sql).
    // 깔린 Windows PC 는 releases 의 켜진 행을 플랫폼을 묻지 않고 전부 받으므로 Mac zip 을
    // 거기 넣을 수 없다. 그래서 목록도 승인도 플랫폼마다 따로이고, 같은 번호(1.1.8)가 양쪽에
    // 있어도 승인은 각각이다. 한쪽 표를 못 읽어도 다른 쪽 목록은 보여야 한다.
    const RELEASE_PLATFORMS = [
      {
        name: 'Windows', table: 'releases', approvals: 'org_release_approvals',
        noteId: 'release-note', listId: 'release-list',
        readError: '업데이트 표를 읽지 못했습니다: ',
        missing: null,   // 표가 없으면 위 문구 뒤에 서버 메시지 (예전 그대로)
        pcsSubj: 'PC 들이', pcsTopic: 'PC 들은', one: 'PC', oneTopic: 'PC 는', allSubj: 'PC 가',
      },
      {
        name: 'Mac', table: 'mac_releases', approvals: 'org_mac_release_approvals',
        noteId: 'mac-release-note', listId: 'mac-release-list',
        readError: 'Mac 업데이트 표를 읽지 못했습니다: ',
        missing: 'Mac 업데이트 표가 아직 없습니다 (supabase/mac_releases.sql)',
        pcsSubj: 'Mac 들이', pcsTopic: 'Mac 들은', one: 'Mac', oneTopic: 'Mac 은', allSubj: 'Mac 이',
      },
    ];

    function parseVer(v) {
      const m = /^(\d+)\.(\d+)\.(\d+)$/.exec(v || '');
      return m ? [Number(m[1]), Number(m[2]), Number(m[3])] : null;
    }
    function cmpVer(a, b) {
      for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] < b[i] ? -1 : 1;
      return 0;
    }

    // 표가 없을 때 PostgREST 가 주는 오류 코드 (예전 판은 Postgres 의 42P01 을 그대로 준다).
    function isMissingTable(err) {
      return !!err && (err.code === 'PGRST205' || err.code === '42P01');
    }

    async function loadReleases() {
      for (const p of RELEASE_PLATFORMS) {
        try {
          await loadPlatformReleases(p);
        } catch (e) {
          // 보통은 supabase-js 가 오류를 돌려주지만, 던져진 예외 하나가 다른 플랫폼 목록까지
          // 막지 않게 한다.
          document.getElementById(p.noteId).textContent = p.readError + ((e && e.message) || e);
          document.getElementById(p.listId).innerHTML = '';
        }
      }
    }

    async function loadPlatformReleases(p) {
      if (!currentOrg) return;
      const note = document.getElementById(p.noteId);
      const container = document.getElementById(p.listId);

      const { data: rels, error: relErr } = await supabase
        .from(p.table)
        .select('version, channel, size, notes, active, published_at')
        .eq('active', true)
        .order('published_at', { ascending: false });

      if (relErr) {
        // 표가 아직 없으면 여기로 온다 (supabase/releases.sql 이나 mac_releases.sql 을 안 돌렸다)
        note.textContent = (p.missing && isMissingTable(relErr)) ? p.missing : p.readError + relErr.message;
        container.innerHTML = '';
        return;
      }

      const { data: apps, error: appErr } = await supabase
        .from(p.approvals)
        .select('version, approved_at')
        .eq('org_id', currentOrg.id);
      if (appErr) {
        note.textContent = (p.missing && isMissingTable(appErr))
          ? p.missing : '승인 목록을 읽지 못했습니다: ' + appErr.message;
        container.innerHTML = '';
        return;
      }
      const approved = new Map((apps || []).map(a => [a.version, a.approved_at]));

      // PC 들이 실제로 받을 것 = 승인된 것 중 가장 높은 버전 (채널별)
      const target = {};
      for (const r of rels || []) {
        if (!approved.has(r.version)) continue;
        const v = parseVer(r.version);
        if (!v) continue;
        if (!target[r.channel] || cmpVer(v, parseVer(target[r.channel])) > 0) target[r.channel] = r.version;
      }
      const parts = [];
      if (target.stable) parts.push(`이 조직의 ${p.pcsSubj} 받을 버전: <b>${escapeHtml(target.stable)}</b>`);
      else parts.push(`승인된 버전이 없습니다. ${p.pcsTopic} 지금 버전을 그대로 씁니다.`);
      if (target.beta) parts.push(`beta 채널: <b>${escapeHtml(target.beta)}</b>`);
      if (currentRole !== 'admin') parts.push('(승인은 관리자만 할 수 있습니다)');
      note.innerHTML = parts.join(' &nbsp;·&nbsp; ');

      if (!rels || rels.length === 0) {
        container.innerHTML = '<div class="empty-msg">올라온 버전이 없습니다.</div>';
        return;
      }

      let html = `<table><thead><tr>
    <th>버전</th><th>채널</th><th>크기</th><th>올린 날</th><th>메모</th><th>이 조직</th>
  </tr></thead><tbody>`;
      for (const r of rels) {
        const isApproved = approved.has(r.version);
        const ro = currentRole === 'admin' ? '' : ' badge-readonly';
        const badge = isApproved
          ? `<span class="badge badge-approved${ro}" data-ver="${escapeHtml(r.version)}" data-approved="true" title="${escapeHtml(formatDate(approved.get(r.version)))} 승인">승인됨</span>`
          : `<span class="badge badge-notyet${ro}" data-ver="${escapeHtml(r.version)}" data-approved="false">승인</span>`;
        const firstLine = (r.notes || '').split(/\r?\n/)[0];
        html += `<tr>
      <td><b>${escapeHtml(r.version)}</b></td>
      <td>${escapeHtml(r.channel)}</td>
      <td>${escapeHtml(formatSize(r.size))}</td>
      <td>${escapeHtml(formatDate(r.published_at))}</td>
      <td title="${escapeHtml(r.notes || '')}">${escapeHtml(firstLine)}</td>
      <td>${badge}</td>
    </tr>`;
      }
      html += '</tbody></table>';
      container.innerHTML = html;

      if (currentRole === 'admin') {
        container.querySelectorAll('[data-ver]').forEach(b => {
          b.addEventListener('click', () => handleApprove(p, b.dataset.ver, b.dataset.approved === 'true'));
        });
      }
    }

    // 확인 창과 알림에 플랫폼 이름을 붙인다 - 두 목록에 같은 번호가 있으면 "1.1.8 을 승인할까요?"
    // 만으로는 어느 쪽인지 모른다.
    async function handleApprove(p, version, currentlyApproved) {
      if (!currentOrg) return;
      try {
        if (currentlyApproved) {
          if (!confirm(`${p.name} ${version} 승인을 취소할까요?\n이미 받은 ${p.oneTopic} 그대로이고, 아직 안 받은 ${p.one} 만 멈춥니다.`)) return;
          const { error } = await supabase.from(p.approvals)
            .delete().eq('org_id', currentOrg.id).eq('version', version);
          if (error) throw error;
          toast(`${p.name} ${version} 승인을 취소했습니다.`);
        } else {
          if (!confirm(`${p.name} ${version} 을 승인할까요?\n이 조직의 모든 ${p.allSubj} 한 시간 안에 묻지 않고 이 버전으로 바뀝니다.`)) return;
          const { error } = await supabase.from(p.approvals)
            .insert({ org_id: currentOrg.id, version });
          if (error) throw error;
          toast(`${p.name} ${version} 을 승인했습니다.`);
        }
        await loadPlatformReleases(p);
      } catch (e) {
        toast('실패: ' + e.message);
      }
    }

    // ── 콘텐츠 목록 로드 ──
    async function loadContents() {
      if (!currentOrg) return;
      const { data, error } = await supabase
        .from('contents')
        .select('*')
        .eq('org_id', currentOrg.id)
        .order('created_at', { ascending: false });

      const container = document.getElementById('content-list');
      if (error) {
        // 조회 실패를 "없음" 으로 보이지 않는다 - 목록이 비어 보이면 같은 파일을
        // 다시 올리게 된다.
        container.innerHTML = `<div class="empty-msg">콘텐츠 목록을 읽지 못했습니다: ${escapeHtml(error.message)}</div>`;
        return;
      }
      if (!data || data.length === 0) {
        container.innerHTML = '<div class="empty-msg">등록된 콘텐츠가 없습니다.</div>';
        return;
      }

      let html = `<table><thead><tr>
    <th>미리보기</th><th>파일명</th><th>유형</th><th>위치</th><th>크기</th><th>업로드일</th><th>상태</th><th></th>
  </tr></thead><tbody>`;

      for (const c of data) {
        const { data: urlData } = await supabase.storage
          .from('content')
          .createSignedUrl(c.storage_path, 3600);
        // 아래에서 HTML 에 넣는 서버 값은 전부 escapeHtml 을 거친다 (속성 안 포함).
        // 서명 URL 도 서버가 돌려준 경로가 들어 있으니 예외가 아니다.
        const signedUrl = escapeHtml(urlData?.signedUrl || '');
        const rowId = escapeHtml(c.id);
        const rowPos = escapeHtml(c.display_position);

        const typeBadge = c.content_type === 'image'
          ? '<span class="badge badge-image">이미지</span>'
          : '<span class="badge badge-video">동영상</span>';
        const posBadge = c.display_position === 'center'
          ? '<span class="badge badge-center">중앙</span>'
          : '<span class="badge badge-banner">배너</span>';

        const preview = c.content_type === 'image' && signedUrl
          ? `<img src="${signedUrl}" style="max-width:80px;max-height:60px;border-radius:4px;object-fit:cover">`
          : c.content_type === 'video' && signedUrl
            ? `<video src="${signedUrl}" style="max-width:80px;max-height:60px;border-radius:4px" muted></video>`
            : '-';

        const isActive = c.active === true;
        const activeBadge = isActive
          ? `<span class="badge badge-active" data-toggle-id="${rowId}" data-position="${rowPos}" data-active="true">송출 중</span>`
          : `<span class="badge badge-inactive" data-toggle-id="${rowId}" data-position="${rowPos}" data-active="false">대기</span>`;

        html += `<tr>
      <td>${preview}</td>
      <td>${signedUrl ? `<a href="${signedUrl}" target="_blank" style="color:var(--accent);text-decoration:none">${escapeHtml(c.filename)}</a>` : escapeHtml(c.filename)}</td>
      <td>${typeBadge}</td>
      <td>${posBadge}</td>
      <td>${escapeHtml(formatSize(c.file_size))}</td>
      <td>${escapeHtml(formatDate(c.created_at))}</td>
      <td>${activeBadge}</td>
      <td><button class="btn-delete" data-id="${rowId}" data-path="${escapeHtml(c.storage_path)}">삭제</button></td>
    </tr>`;
      }
      html += '</tbody></table>';
      container.innerHTML = html;

      // 상태 토글 이벤트
      container.querySelectorAll('[data-toggle-id]').forEach(badge => {
        badge.addEventListener('click', () => handleToggleActive(
          badge.dataset.toggleId,
          badge.dataset.position,
          badge.dataset.active === 'true'
        ));
      });

      // 삭제 버튼 이벤트
      container.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', () => handleDelete(btn.dataset.id, btn.dataset.path));
      });
    }

    // 글자 자리와 속성 자리("...") 양쪽에서 안전해야 한다. 예전 것은 textContent 로
    // 넣고 innerHTML 로 읽었는데, 그 길은 & < > 만 바꾸고 따옴표는 그대로 둔다.
    // data-path="${...}" 에 넣은 storage_path 에 " 가 있으면 속성이 거기서 닫히고
    // 뒤가 버튼의 새 속성(onmouseover 등)이 됐다 - 조직의 멤버가 행을 직접 써서
    // 관리자의 세션으로 스크립트를 돌릴 수 있는 길이었다. 릴리스 메모의 title 도
    // 메모에 " 가 있으면 잘렸다.
    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ── 상태 토글 ──
    async function handleToggleActive(id, displayPosition, currentlyActive) {
      if (!currentOrg) return;

      const newActive = !currentlyActive;
      let turnedOff = false;   // 끄기 요청이 이미 나갔는가 (요청이 둘이다)

      try {
        if (newActive) {
          // 같은 org, 같은 display_position의 다른 아이템을 비활성화.
          // 위치마다 켜진 행은 하나뿐이어야 한다 (서버가 막는다) - 먼저 끄고 켠다.
          const { error: deactivateErr } = await supabase
            .from('contents')
            .update({ active: false })
            .eq('org_id', currentOrg.id)
            .eq('display_position', displayPosition)
            .eq('active', true);

          if (deactivateErr) throw deactivateErr;
          turnedOff = true;
        }

        // 해당 아이템의 active 상태 변경. 바뀐 행을 돌려받아 본다 - 다른 곳에서 이미
        // 지운 항목이면 0 행이 바뀌고 오류는 없어서, 안 보면 "시작되었습니다" 라고 말한다.
        const { data: changed, error: updateErr } = await supabase
          .from('contents')
          .update({ active: newActive })
          .eq('id', id)
          .select('id');

        if (updateErr) throw updateErr;
        if (!changed || changed.length === 0) {
          throw new Error('항목을 찾지 못했습니다 (다른 곳에서 지워졌을 수 있습니다).');
        }

        toast(newActive ? '송출이 시작되었습니다.' : '송출이 중지되었습니다.');
        await loadContents();
      } catch (e) {
        // 끄기는 됐고 켜기만 실패했을 수 있다. 그러면 이 위치에는 지금 송출 중인
        // 것이 없고, PC 는 다음에 켜질 때 그 자리를 비운다. 표를 서버의 실제 상태로
        // 다시 그려서, 예전 표가 "송출 중" 이라고 말하고 있지 않게 한다.
        toast('상태 변경 실패: ' + e.message +
              (turnedOff ? ' - 이 위치에 지금 송출 중인 항목이 없을 수 있습니다. 표를 확인하세요.' : ''));
        await loadContents();
      }
    }

    // ── 업로드 ──
    window.handleUpload = async function () {
      const fileInput = document.getElementById('file-input');
      const position = document.getElementById('position-select').value;
      const status = document.getElementById('upload-status');
      const btn = document.getElementById('btn-upload');

      const file = fileInput.files[0];
      if (!file) { status.textContent = '파일을 선택하세요.'; return; }
      if (!currentOrg) return;

      // 서버가 행의 모양을 검사한다 (contents 의 CHECK, PC 도 따로 본다):
      //   storage_path = 조직id/해시64.확장자,  확장자는 CONTENT_EXT 에 있는 것만,
      //   content_type 은 그 확장자의 종류,  file_size 는 1 ~ 200 MB.
      // 파일 이름의 끝을 그대로 경로에 쓰던 때는 '사진.JPG' 가 대문자로, 점이 없는
      // 이름은 이름 전체가 확장자로 들어갔다. 올리기 전에 여기서 거절해야 파일만
      // 올라가고 행이 거절되는 일이 없다.
      //
      // 종류를 브라우저가 알려 준 형식(file.type)이 아니라 확장자로 정한다. PC 가
      // 확장자로 영상/그림을 가르기 때문이고, file.type 은 비어 올 수 있기 때문이다
      // (.mkv 나 .mov 는 운영체제에 등록이 없으면 빈 값이다).
      const dot = file.name.lastIndexOf('.');
      const ext = dot >= 0 ? file.name.slice(dot + 1).toLowerCase() : '';
      const kind = Object.prototype.hasOwnProperty.call(CONTENT_EXT, ext) ? CONTENT_EXT[ext] : null;
      if (!kind) {
        status.textContent = '올릴 수 없는 형식입니다. 그림은 png · jpg · jpeg · bmp · gif, 영상은 mp4 · avi · wmv · mkv · mov · webm 만 PC 가 띄울 수 있습니다.';
        return;
      }
      const contentType = kind.type;
      if (!(file.size > 0)) {
        status.textContent = '빈 파일은 올릴 수 없습니다.';
        return;
      }
      if (file.size > CONTENT_MAX_BYTES) {
        status.textContent = '200 MB 보다 큰 파일은 올릴 수 없습니다.';
        return;
      }
      if (position !== 'center' && position !== 'banner') {
        status.textContent = '표시 위치를 선택하세요.';
        return;
      }

      btn.disabled = true;
      status.textContent = '해시 계산 중...';

      try {
        const hash = await computeSHA256(file);
        const storagePath = `${currentOrg.id}/${hash}.${ext}`;

        status.textContent = '업로드 중...';

        // Storage 업로드. 버킷은 그림/영상이라고 밝힌 것만 받는다 - 브라우저가
        // 형식을 모르거나 (빈 값) 확장자와 다른 종류로 알려 주면 확장자의 형식을 적어 보낸다.
        const body = file.type.startsWith(contentType + '/')
          ? file
          : new File([file], file.name, { type: kind.mime });
        const { error: uploadErr } = await supabase.storage
          .from('content')
          .upload(storagePath, body, { upsert: true });

        if (uploadErr) throw uploadErr;

        // 같은 위치에 활성 콘텐츠가 없으면 자동 활성화. 물어보지 못했으면 켜지 않는다 -
        // 위치마다 켜진 행은 하나뿐이어야 하고 (서버가 막는다), 켜는 것은 목록에서 할 수 있다.
        const { data: existing, error: existErr } = await supabase
          .from('contents')
          .select('id')
          .eq('org_id', currentOrg.id)
          .eq('display_position', position)
          .eq('active', true)
          .limit(1);
        const autoActive = !existErr && existing && existing.length === 0;

        // DB 레코드 생성
        const { error: dbErr } = await supabase.from('contents').insert({
          org_id: currentOrg.id,
          filename: file.name,
          storage_path: storagePath,
          file_hash: hash,
          file_size: file.size,
          content_type: contentType,
          display_position: position,
          active: autoActive
        });

        if (dbErr) {
          // 파일은 올라갔는데 행이 거절됐다. 그대로 두면 어느 행도 가리키지 않는
          // 파일이 버킷에 남는다 (목록에 없으니 대시보드로는 지울 길도 없다).
          // 방금 올린 것을 되돌리되, 같은 파일을 가리키는 행이 이미 있으면 (경로가
          // 해시라서 같은 파일은 같은 경로다) 그 행의 파일이므로 건드리지 않는다.
          // 세어 보지 못했으면 지우지 않는다 - 남는 쪽이 지워지는 쪽보다 낫다.
          let leftover = '';
          const { count: refs, error: cntErr } = await supabase.from('contents')
            .select('id', { count: 'exact', head: true })
            .eq('storage_path', storagePath);
          if (cntErr) {
            leftover = ' (올린 파일이 버킷에 남았을 수 있습니다.)';
          } else if (refs === 0) {
            const { error: rmErr } = await supabase.storage
              .from('content')
              .remove([storagePath]);
            if (rmErr) leftover = ' (올린 파일이 버킷에 남았습니다: ' + rmErr.message + ')';
          }
          throw new Error('목록에 등록하지 못했습니다: ' + dbErr.message + leftover);
        }

        status.textContent = '업로드 완료!';
        fileInput.value = '';
        toast('콘텐츠가 업로드되었습니다.');
        await loadContents();
      } catch (e) {
        status.textContent = '오류: ' + e.message;
      } finally {
        btn.disabled = false;
      }
    };

    // ── 삭제 ──
    async function handleDelete(id, storagePath) {
      if (!confirm('이 콘텐츠를 삭제하시겠습니까?')) return;

      // 경로가 파일의 해시라서, 같은 파일을 두 번 올리면 (중앙과 배너에 같은
      // 그림) 두 행이 파일 하나를 가리킨다. 한 행을 지울 때 파일까지 지우면 남은
      // 행은 없는 파일을 가리키고, PC 는 그 자리에서 아무것도 받지 못한다.
      // 그래서 행을 먼저 지우고, 파일은 가리키는 행이 더 없을 때만 지운다.
      const { count: others, error: cntErr } = await supabase.from('contents')
        .select('id', { count: 'exact', head: true })
        .eq('storage_path', storagePath)
        .neq('id', id);
      if (cntErr) { toast('삭제 실패: ' + cntErr.message); return; }

      const { error: dbErr } = await supabase.from('contents')
        .delete()
        .eq('id', id);

      if (dbErr) { toast('삭제 실패: ' + dbErr.message); return; }

      if (!others) {
        const { error: storageErr } = await supabase.storage
          .from('content')
          .remove([storagePath]);
        if (storageErr) { toast('행은 지웠지만 파일이 남았습니다: ' + storageErr.message); await loadContents(); return; }
      }

      toast('삭제되었습니다.');
      await loadContents();
    }

    // ── 조직 ID 복사 ──
    window.copyOrgId = function () {
      if (!currentOrg) return;
      navigator.clipboard.writeText(currentOrg.id).then(() => toast('조직 ID가 복사되었습니다.'));
    };

    // ── API URL 복사 ──
    window.copyApiUrl = function () {
      const url = document.getElementById('api-url-display').textContent;
      if (url === '-') return;
      navigator.clipboard.writeText(url).then(() => toast('API URL이 복사되었습니다.'));
    };

    // ── 페이지 로드 시 세션 확인 ──
    const { data: { session } } = await supabase.auth.getSession();
    if (session) await initDashboard();
  </script>
</body>
