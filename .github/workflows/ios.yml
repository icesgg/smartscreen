# iOS 컴패니언 앱(ios/SSBeacon) 타입 검사.
#
# 저장소에 .xcodeproj 가 없고 앱은 사용자가 Mac 의 Xcode 에서 직접 빌드한다. 이 PC 에는
# Swift 컴파일러가 없어서, 예전에는 SSBeaconApp.swift 를 고치고도 컴파일되는지 아무도 몰랐다
# (NEXT_SESSION.md 의 "컴파일 검증 못 했음"). 여기서 iOS SDK 로 타입 검사만 한다 - 서명,
# 링크, 실행은 하지 않는다. 블루투스 동작은 실기에서만 확인된다.
name: ios

on:
  push:
    branches: [main, mac, ios]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: macos-15
    # shell: bash 는 -e -o pipefail 로 돈다. 기본 셸은 pipefail 이 없어 `swiftc | tee` 의 실패가 묻힌다.
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    env:
      # 최소 배포 버전. ios/ 에는 Info.plist 도 배포 대상 메모도 없으므로(Xcode 가 프로젝트를
      # 만들 때 정한다) 코드가 쓰는 API 중 가장 새것으로 정했다:
      #   iOS 14: SwiftUI App / @main / @StateObject
      #   iOS 15: .textSelection(.enabled), .buttonStyle(.borderedProminent)  <- 가장 새것
      #   (CryptoKit, ASWebAuthenticationSession.presentationContextProvider, connectedScenes 는 iOS 13)
      # Xcode 의 새 프로젝트는 배포 대상이 SDK 버전(훨씬 높다)이라 거기서도 통과한다. 낮은 쪽으로
      # 검사해야 iOS 15 보다 새 API 를 @available 없이 쓰는 실수가 여기서 걸린다.
      # 이 값을 올리면 README.md 의 Xcode 설정에도 적을 것.
      IOS_MIN: '15.0'
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          echo "iphoneos SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          xcrun swiftc --version
          echo "installed:"
          ls -d /Applications/Xcode*.app

      # -parse-as-library: 파일이 하나면 swiftc 는 그것을 main.swift 처럼(최상위 코드 허용)
      # 읽고, 그러면 @main 이 "'main' attribute cannot be used in a module that contains
      # top-level code" 로 거절된다. Xcode 의 앱 타깃처럼 라이브러리 모드로 읽게 한다 (main.swift 없음).
      # -swift-version 5: Xcode 새 프로젝트의 기본 언어 모드.
      - name: Typecheck (iphoneos arm64, iOS ${{ env.IOS_MIN }})
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' f; do files+=("$f"); done \
            < <(find ios/SSBeacon -name '*.swift' -print0 | sort -z)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::ios/SSBeacon 에 .swift 파일이 없다"
            exit 1
          fi
          printf 'file: %s\n' "${files[@]}"
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos swiftc -typecheck \
            -sdk "$sdk" \
            -target "arm64-apple-ios${IOS_MIN}" \
            -swift-version 5 \
            -module-name SSBeacon \
            -parse-as-library \
            "${files[@]}" 2>&1 | tee ios-typecheck.log
          echo "typecheck OK: ${#files[@]} file(s), iOS ${IOS_MIN}"

      # -typecheck 는 의미 분석까지만 한다. "missing return", 초기화 전 사용 같은 오류는 그 다음
      # SIL 단계에서 나오므로 Xcode 빌드에서는 걸리는데 위 검사는 통과한다. SIL 까지 만들어 본다
      # (기계어는 만들지 않는다).
      - name: SIL diagnostics (iphoneos arm64, iOS ${{ env.IOS_MIN }})
        if: always()
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' f; do files+=("$f"); done \
            < <(find ios/SSBeacon -name '*.swift' -print0 | sort -z)
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos swiftc -emit-sil -wmo -o /dev/null \
            -sdk "$sdk" \
            -target "arm64-apple-ios${IOS_MIN}" \
            -swift-version 5 \
            -module-name SSBeacon \
            -parse-as-library \
            "${files[@]}" 2>&1 | tee ios-sil.log
          echo "SIL OK"

      # 위 검사가 헛돌지 않는다는 확인: iOS 16 API(NavigationStack)를 쓴 파일은 같은 명령에
      # 거절돼야 한다. 통과하면 -target 이 먹지 않는 것이고, 그러면 위의 "통과" 도 믿을 수 없다.
      - name: Canary (iOS 16 API must be rejected at iOS ${{ env.IOS_MIN }})
        if: always()
        run: |
          set -uo pipefail
          c="$RUNNER_TEMP/Canary.swift"
          cat > "$c" <<'EOF'
          import SwiftUI
          @main
          struct Canary: App {
              var body: some Scene { WindowGroup { NavigationStack { Text("x") } } }
          }
          EOF
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          if xcrun --sdk iphoneos swiftc -typecheck -sdk "$sdk" \
               -target "arm64-apple-ios${IOS_MIN}" -swift-version 5 \
               -module-name Canary -parse-as-library "$c" > canary.log 2>&1; then
            cat canary.log
            echo "::error::canary passed - the typecheck does not enforce iOS ${IOS_MIN} availability"
            exit 1
          fi
          cat canary.log
          if ! grep -q "only available in iOS 16" canary.log; then
            echo "::error::canary failed for an unexpected reason"
            exit 1
          fi
          echo "canary OK: rejected as expected"

      # Xcode 26 이 새 앱 프로젝트에 켜는 기본값(기본 격리 MainActor + Approachable Concurrency +
      # MemberImportVisibility)으로 한 번 더. 사용자의 프로젝트가 어느 Xcode 로 만들어졌는지
      # 모르므로 둘 다 통과해야 한다. 처음 돌렸을 때 여기서만 `import Combine` 이 없다는 오류가
      # 났다 (MemberImportVisibility). 러너에 Xcode 26 이상이 없으면 건너뛴다.
      - name: Typecheck (Xcode 26 new-project defaults)
        if: always()
        run: |
          set -euo pipefail
          app="$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$app" ]; then
            echo "::notice::no Xcode 26+ on this runner - skipped"
            exit 0
          fi
          export DEVELOPER_DIR="$app/Contents/Developer"
          xcodebuild -version
          xcrun swiftc --version
          files=()
          while IFS= read -r -d '' f; do files+=("$f"); done \
            < <(find ios/SSBeacon -name '*.swift' -print0 | sort -z)
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos swiftc -typecheck \
            -sdk "$sdk" \
            -target "arm64-apple-ios${IOS_MIN}" \
            -swift-version 5 \
            -module-name SSBeacon \
            -parse-as-library \
            -default-isolation MainActor \
            -enable-upcoming-feature DisableOutwardActorInference \
            -enable-upcoming-feature GlobalActorIsolatedTypesUsability \
            -enable-upcoming-feature InferIsolatedConformances \
            -enable-upcoming-feature InferSendableFromCaptures \
            -enable-upcoming-feature NonisolatedNonsendingByDefault \
            -enable-upcoming-feature MemberImportVisibility \
            "${files[@]}" 2>&1 | tee ios-typecheck-xcode26.log
          echo "typecheck OK (Xcode 26 defaults)"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-typecheck-log
          path: |
            ios-typecheck.log
            ios-sil.log
            ios-typecheck-xcode26.log
            canary.log
          if-no-files-found: ignore
          retention-days: 14
